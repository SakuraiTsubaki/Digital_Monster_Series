name: Apply verified Digimon registration

on:
  push:
    branches: [main]
    paths:
      - ".codex/registration-parts/**"
      - ".github/workflows/apply-verified-registration.yml"

permissions:
  contents: write

concurrency:
  group: apply-verified-registration-main
  cancel-in-progress: false

jobs:
  apply-validate-build-commit:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 0
      DEPRECATED_ERROR: 0
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Reassemble and apply verified patch
        run: |
          cat .codex/registration-parts/part-* > /tmp/registration.patch.gz
          gzip -dc /tmp/registration.patch.gz > /tmp/registration.patch
          git apply --index --whitespace=nowarn /tmp/registration.patch
          git rm -r .codex/registration-parts .github/workflows/apply-verified-registration.yml

      - name: Validate official dataset and runtime catalogs
        run: |
          python3 data/digimon_reference/scripts/verify_committed_dataset.py --live-master data/digimon_reference/master/digimon_master.json
          python3 engine/emerald/validation/verify_id_capacity.py
          python3 engine/emerald/validation/verify_generated_runtime.py
          python3 engine/emerald/validation/verify_font_v0.py
          python3 engine/emerald/validation/verify_profile_parameter_policy.py
          python3 engine/emerald/tools/build_profile_parameter_evidence.py --output /tmp/profile-parameter-evidence.csv
          python3 engine/emerald/validation/verify_profile_derived_parameters.py             --parameters engine/emerald/generated/profile-derived-parameters.csv             --species-dir engine/emerald/generated/pokeemerald-expansion/src/data/pokemon/species_info
          python3 engine/emerald/validation/verify_profile_derived_techniques.py             --parameters engine/emerald/generated/profile-derived-techniques.csv             --move-info engine/emerald/generated/pokeemerald-expansion/src/data/digital_monster/moves_info.inc
          python3 engine/emerald/tools/build_digital_monster_sprite_manifest.py --check
          python3 engine/emerald/validation/verify_digital_monster_sprites.py
          python3 -m compileall -q data/digimon_reference engine/emerald

      - name: Checkout pinned pokeemerald-expansion
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
          path: engine-build

      - name: Apply and verify pinned engine integration
        run: |
          python3 engine/emerald/tools/apply_pinned_engine_integration.py engine-build
          python3 engine/emerald/tools/sync_generated_engine_files.py engine-build
          python3 engine/emerald/tools/sync_digital_monster_sprite_assets.py engine-build
          python3 engine/emerald/validation/verify_move_storage_patch.py engine-build
          python3 engine/emerald/validation/verify_font_v0.py engine-build

      - name: Install GBA build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build and verify ROM
        working-directory: engine-build
        run: |
          make DIGITAL_MONSTER_SERIES=1 -j$(nproc) -O all
          test -f pokeemerald.gba
          size=$(stat -c%s pokeemerald.gba)
          test "$size" -le 33554432
          sha256sum pokeemerald.gba
          rm -f pokeemerald.gba

      - name: Commit verified registration to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Register four new official Digimon"
          git push origin HEAD:main
