name: Refresh Profile-Derived Parameters

on:
  push:
    branches: [main]
    paths:
      - "engine/emerald/tools/derive_profile_parameters.py"
      - "engine/emerald/tools/render_profile_parameters.py"
      - "engine/emerald/validation/verify_profile_derived_parameters.py"
      - "engine/emerald/tools/derive_profile_techniques.py"
      - "engine/emerald/tools/render_profile_techniques.py"
      - "engine/emerald/validation/verify_profile_derived_techniques.py"
      - ".github/workflows/profile-derived-parameters.yml"
  workflow_dispatch:

concurrency:
  group: profile-derived-parameters-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 0
      DEPRECATED_ERROR: 0
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install scraper dependency
        run: python3 -m pip install --disable-pip-version-check lxml

      - name: Re-census official Japanese Digimon profiles
        run: |
          python3 data/digimon_reference/scripts/scrape_digimon_reference.py \
            --output /tmp/digimon_reference \
            --workers 8

      - name: Derive profile-backed species parameters
        run: |
          python3 engine/emerald/tools/derive_profile_parameters.py \
            --digimon-master-json /tmp/digimon_reference/master/digimon_master.json \
            --output engine/emerald/generated/profile-derived-parameters.csv

      - name: Render generated SpeciesInfo
        run: |
          python3 engine/emerald/tools/render_profile_parameters.py \
            --parameters engine/emerald/generated/profile-derived-parameters.csv \
            --species-dir engine/emerald/generated/pokeemerald-expansion/src/data/pokemon/species_info

      - name: Verify profile-derived parameters
        run: |
          python3 engine/emerald/validation/verify_profile_derived_parameters.py \
            --parameters engine/emerald/generated/profile-derived-parameters.csv \
            --species-dir engine/emerald/generated/pokeemerald-expansion/src/data/pokemon/species_info

      - name: Derive profile-backed techniques
        run: |
          python3 engine/emerald/tools/derive_profile_techniques.py \
            --digimon-master-json /tmp/digimon_reference/master/digimon_master.json \
            --species-parameters engine/emerald/generated/profile-derived-parameters.csv \
            --output engine/emerald/generated/profile-derived-techniques.csv

      - name: Render generated MoveInfo
        run: |
          python3 engine/emerald/tools/render_profile_techniques.py \
            --parameters engine/emerald/generated/profile-derived-techniques.csv \
            --output engine/emerald/generated/pokeemerald-expansion/src/data/digital_monster/moves_info.inc

      - name: Verify profile-derived techniques
        run: |
          python3 engine/emerald/validation/verify_profile_derived_techniques.py \
            --parameters engine/emerald/generated/profile-derived-techniques.csv \
            --move-info engine/emerald/generated/pokeemerald-expansion/src/data/digital_monster/moves_info.inc

      - name: Checkout pinned pokeemerald-expansion
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
          path: engine-build

      - name: Apply generated runtime to pinned engine
        run: |
          python3 engine/emerald/tools/apply_pinned_engine_integration.py engine-build
          python3 engine/emerald/tools/sync_generated_engine_files.py engine-build
          python3 engine/emerald/tools/sync_digital_monster_sprite_assets.py engine-build
          python3 engine/emerald/validation/verify_move_storage_patch.py engine-build
          python3 engine/emerald/validation/verify_font_v0.py engine-build

      - name: Install GBA build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build refreshed Digital Monster Emerald
        working-directory: engine-build
        run: make DIGITAL_MONSTER_SERIES=1 -j$(nproc) -O all

      - name: Verify refreshed ROM and discard binary
        working-directory: engine-build
        run: |
          test -f pokeemerald.gba
          size=$(stat -c%s pokeemerald.gba)
          test "$size" -le 33554432
          sha256sum pokeemerald.gba
          rm -f pokeemerald.gba

      - name: Commit generated parameters to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/emerald/generated/profile-derived-parameters.csv \
            engine/emerald/generated/profile-derived-techniques.csv \
            engine/emerald/generated/pokeemerald-expansion/src/data/pokemon/species_info/digital_monster_part_*.h \
            engine/emerald/generated/pokeemerald-expansion/src/data/digital_monster/moves_info.inc
          if git diff --cached --quiet; then
            echo "No profile-derived parameter changes."
            exit 0
          fi
          git commit -m "Generate profile-derived Digital Monster gameplay parameters"
          git pull --rebase origin main
          git push origin HEAD:main
